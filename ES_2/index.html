<!DOCTYPE html>
<html lang="en">

    <title>Tabella dispositivi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tabella dispositivi</h1>

      <th>Device</th>
      <th>Room</th>
      <th>Quantity</th>
      <th>Status</th>

    <tr>
      <td>Computer</td>
      <td>Lab 1</td>
      <td>20</td>
      <td class="available">Available</td>
    </tr>
    <tr>
      <td>Raspberry Pi</td>
      <td>Lab 2</td>
      <td>10</td>
      <td class="available">Available</td>
    </tr>
    <tr>
      <td>Arduino</td>
      <td>Lab 2</td>
      <td>15</td>
      <td class="maintenance">Maintenance</td>
    </tr>
    <tr>
      <td>3D Printer</td>
      <td>Lab 3</td>
      <td>2</td>
      <td class="available">Available</td>
    </tr>
</table>


</body>
</html>
